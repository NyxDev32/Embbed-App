<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Announcer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
  <source src="bg.mp4" type="video/mp4">
  <source src="https://files.catbox.moe/cfkhgq.mp4" type="video/mp4">
</video>
<div class="bg"></div>

<header class="top">
  <div class="logo">SC<img src="logo.png" alt="" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></div>
  <div>
    <h1>Update Announcer</h1>
    <p class="mono">discord embed publisher</p>
  </div>
  <span class="status mono" id="status"><i></i>offline</span>
</header>

<main class="layout">
  <section class="col">
    <form id="form" autocomplete="off" novalidate>

      <div class="card">
        <h2 class="mono">// target</h2>
        <div class="tiles">
          <button type="button" class="tile active" data-mode="webhook">
            <svg class="ic" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            Webhook
          </button>
          <button type="button" class="tile" data-mode="bot">
            <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 7V3M9 13h.01M15 13h.01M3 13h2M19 13h2"/></svg>
            Bot Token
          </button>
        </div>
        <div id="webhookBox" class="field">
          <label for="webhook_url">Webhook URL</label>
          <input id="webhook_url" class="mono" type="password" placeholder="https://discord.com/api/webhooks/…">
        </div>
        <div id="botBox" class="hidden">
          <div class="field"><label for="bot_token">Token bot</label>
            <input id="bot_token" class="mono" type="password" placeholder="Token dari Developer Portal"></div>
          <div class="field"><label for="channel_id">Channel ID</label>
            <input id="channel_id" class="mono" inputmode="numeric" placeholder="123456789012345678"></div>
        </div>
        <label class="check"><input type="checkbox" id="remember"> Ingat di browser ini</label>
      </div>

      <div class="card">
        <h2 class="mono">// message</h2>
        <div class="row">
          <div class="field grow"><label for="title">Judul update</label>
            <input id="title" maxlength="256" placeholder="Auto Farm lebih cepat"></div>
          <div class="field w96"><label for="version">Versi</label>
            <input id="version" class="mono" placeholder="v1.4.0"></div>
        </div>
        <div class="field">
          <label for="description">Deskripsi <span class="hint">markdown Discord</span></label>
          <textarea id="description" class="mono" rows="3" placeholder="Ringkasan singkat. **tebal**, *miring*, `kode`, ||spoiler||"></textarea>
        </div>
        <div class="field">
          <label for="changelog">Changelog</label>
          <div class="chips">
            <button type="button" data-ins="+ ">+ added</button>
            <button type="button" data-ins="! ">! fixed</button>
            <button type="button" data-ins="* ">* changed</button>
            <button type="button" data-ins="- ">- removed</button>
          </div>
          <textarea id="changelog" class="mono" rows="6" placeholder="+ Menu setting baru&#10;! Perbaiki bug teleport&#10;* Loading lebih ringan&#10;- Hapus fitur lama"></textarea>
          <label class="check"><input type="checkbox" id="group" checked> Kelompokkan otomatis berdasarkan prefix</label>
        </div>
        <div class="field">
          <label for="info">Info tambahan <span class="hint">satu baris "Kunci: nilai", tampil sejajar</span></label>
          <textarea id="info" class="mono" rows="2" placeholder="Game: Roblox&#10;Status: Undetected&#10;Platform: Android"></textarea>
        </div>
      </div>

      <div class="card">
        <h2 class="mono">// media</h2>
        <div class="field"><label for="video_url">Link video <span class="hint">YouTube / Drive</span></label>
          <input id="video_url" class="mono" type="url" placeholder="https://youtu.be/…"></div>
        <div class="field"><label for="video_file">Atau upload video <span class="hint">mp4, webm, mov, mkv · maks 10 MB</span></label>
          <input id="video_file" type="file" accept="video/mp4,video/webm,video/quicktime,.mkv"></div>
        <div class="field"><label for="download_url">Link download</label>
          <input id="download_url" class="mono" type="url" placeholder="https://…"></div>
      </div>

      <details class="card" open>
        <summary class="mono">// embed style</summary>
        <div class="row">
          <div class="field grow"><label for="author">Author</label>
            <input id="author" placeholder="Nama kamu / tim"></div>
          <div class="field grow"><label for="author_icon">Icon author</label>
            <input id="author_icon" class="mono" placeholder="https://…/icon.png"></div>
        </div>
        <div class="row">
          <div class="field grow"><label for="thumbnail">Thumbnail <span class="hint">kecil, kanan atas</span></label>
            <input id="thumbnail" class="mono" placeholder="https://…/logo.png"></div>
          <div class="field grow"><label for="image">Gambar besar <span class="hint">bawah embed</span></label>
            <input id="image" class="mono" placeholder="https://…/screenshot.png"></div>
        </div>
        <div class="field"><label for="footer">Teks footer</label>
          <input id="footer" placeholder="Update Announcement"></div>
        <div class="field">
          <label>Warna garis</label>
          <div class="swatches" id="swatches">
            <button type="button" data-c="#2aa3e6" style="--c:#2aa3e6" aria-label="Biru"></button>
            <button type="button" data-c="#5865f2" style="--c:#5865f2" aria-label="Blurple"></button>
            <button type="button" data-c="#3ddc97" style="--c:#3ddc97" aria-label="Hijau"></button>
            <button type="button" data-c="#ffb020" style="--c:#ffb020" aria-label="Kuning"></button>
            <button type="button" data-c="#ff5d73" style="--c:#ff5d73" aria-label="Merah"></button>
            <button type="button" data-c="#a78bfa" style="--c:#a78bfa" aria-label="Ungu"></button>
            <input id="color" type="color" value="#2aa3e6" aria-label="Warna kustom">
          </div>
        </div>
        <div class="row">
          <div class="field grow"><label for="mention">Mention</label>
            <select id="mention"><option value="">Tidak ada</option><option>@everyone</option><option>@here</option></select></div>
          <div class="field grow"><label for="username">Nama pengirim <span class="hint">webhook</span></label>
            <input id="username" placeholder="Opsional"></div>
        </div>
        <label class="check"><input type="checkbox" id="timestamp" checked> Tampilkan timestamp</label>
      </details>

      <div id="errors" class="errors hidden" role="alert"></div>
      <button type="submit" id="send" class="btn primary">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span>Kirim ke Discord</span>
      </button>
    </form>
  </section>

  <section class="col side">
    <div class="card">
      <div class="head"><h2 class="mono">// preview</h2><span class="mono counter" id="counter"></span></div>
      <div class="discord">
        <div class="msg">
          <div class="avatar" id="pvAvatar">U</div>
          <div class="body">
            <div class="meta"><b id="pvName">Update Announcer</b><span class="badge">APP</span><span class="time" id="pvTime"></span></div>
            <div class="content" id="pvContent"></div>
            <div class="embed" id="pvEmbed"></div>
            <div class="e-file hidden" id="pvFile"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="head"><h2 class="mono">// history</h2><button type="button" class="link" id="clearHist">hapus semua</button></div>
      <ul id="history" class="history"></ul>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="script.js"></script>
</body>
</html>
